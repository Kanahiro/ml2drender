# Compare the PR's WASM against its base on the same runner (scripts/bench.ts) and report the result
# as a PR comment and job summary. Fails when a case is slower than the base by more than 10%.
name: Benchmark

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the base
        run: |
          git fetch --depth 1 origin ${{ github.event.pull_request.base.sha }}
          git worktree add --detach ../base FETCH_HEAD
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup toolchain install # rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - run: test -d fixtures/render || pnpm fixtures
      - run: pnpm install --frozen-lockfile --filter ./packages/ml2drender
      - run: pnpm build:wasm
      # A base from the pure TypeScript era renders without WASM.
      - name: Prepare the base
        run: |
          if [ -f ../base/Cargo.toml ]; then
            cd ../base && rustup target add wasm32-unknown-unknown && cargo build -p ml2drender-wasm --target wasm32-unknown-unknown --profile wasm --target-dir "$GITHUB_WORKSPACE/target/base"
          else
            cd ../base && pnpm install --frozen-lockfile --filter ./packages/ml2drender
          fi
      - name: Benchmark
        id: bench
        continue-on-error: true
        run: node scripts/bench.ts base=../base:target/base/wasm32-unknown-unknown/wasm/ml2drender_wasm.wasm pr=. | tee bench.md
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # Fork PRs get a read-only token: they only get the job summary.
          COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test -s bench.md || echo "ベンチマークが完了しませんでした。ジョブのログを確認してください。" > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMMENT" = true ]; then gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file bench.md; fi
      - name: Fail on regression
        if: steps.bench.outcome == 'failure'
        run: |
          echo "::error::A benchmark case is more than 10% slower than the base, or the benchmark failed. See the job summary."
          exit 1
