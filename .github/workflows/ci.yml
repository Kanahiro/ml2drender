name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # The render / expression test summaries as a PR comment (updated in place on every push).
  test-report:
    needs: build
    # Fork PRs get a read-only token: they only get the job summary.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: test-summary
          path: summary
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat summary/*/summary.md > report.md 2>/dev/null || echo "The tests did not run. See the build / rust job." > report.md
          echo "[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> report.md
          sh scripts/pr-comment.sh ${{ github.event.pull_request.number }} test-report report.md
