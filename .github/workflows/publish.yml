# Publish the version in the repository (all packages share it) to npm and PyPI.
#   npm:  @ml2drender/wasm, @ml2drender/node and its platform packages (@ml2drender/node-<platform>-<arch>)
#   PyPI: ml2drender (wheels only)
# Both use trusted publishing (OIDC) with provenance. npm accepts trusted publishing only for packages
# that exist, so the first npm release needs an NPM_TOKEN secret of the `npm` environment (not a
# repository secret); remove it after configuring trusted publishers. PyPI accepts a pending publisher
# for a new project (environment `pypi`).
# Packages are built with pnpm; the npm CLI only uploads the tarballs, as pnpm publish has no OIDC
# trusted publishing.
name: Publish

on:
  workflow_dispatch:
    inputs:
      npm:
        description: Publish to npm
        type: boolean
        default: true
      pypi:
        description: Publish to PyPI
        type: boolean
        default: true
      dry_run:
        description: Build and check without publishing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check that the packages share a version
        run: |
          npm=$(node -p "require('./packages/ml2drender/package.json').version")
          node=$(node -p "require('./packages/ml2drender-node/package.json').version")
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/python/Cargo.toml)
          echo "@ml2drender/wasm $npm, @ml2drender/node $node, python $python"
          test "$npm" = "$node" && test "$npm" = "$python"
          echo "version=$npm" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  npm:
    if: inputs.npm
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # npm rejects --provenance from a private repository.
      FLAGS: --access public ${{ !github.event.repository.private && '--provenance' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: napi-*
          path: napi
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: npm
      # Platform packages first: @ml2drender/node depends on them.
      # Paths start with ./ because npm reads a bare `a/b` as the GitHub repository a/b.
      - run: |
          node scripts/npm-node.ts platforms napi platforms
          for dir in ./platforms/*; do npm publish "$dir" $FLAGS; done
          npm publish "./npm/ml2drender-node-$VERSION.tgz" $FLAGS
          npm publish "./npm/ml2drender-wasm-$VERSION.tgz" $FLAGS

  pypi:
    if: inputs.pypi
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx twine check --strict dist/*
        env:
          UV_EXCLUDE_NEWER: 7 days
      - if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
