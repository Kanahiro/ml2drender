<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ml2drender demo</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[name=style] { width: 420px; }
  input[type=number] { width: 4em; }
  .panes { display: flex; gap: 16px; }
  .panes h2 { font-size: 14px; margin: 0 0 4px; }
  #map, #out { width: 512px; height: 512px; border: 1px solid #ccc; }
  #log { background: #f4f4f4; padding: 8px; max-width: 1044px; white-space: pre-wrap; }
  .error { color: #b00; }
  #status { font-weight: normal; color: #666; }
  #status.error { color: #b00; }
</style>
</head>
<body>
<form id="controls">
  <label>style <input name="style" value="https://demotiles.maplibre.org/style.json"></label>
  <label>z <input type="number" name="z" value="2" min="0"></label>
  <label>x <input type="number" name="x" value="3" min="0"></label>
  <label>y <input type="number" name="y" value="1" min="0"></label>
  <button type="button" id="tile">タイルへ移動</button>
  <button type="submit">再描画</button>
</form>
<div class="panes">
  <div><h2>MapLibre GL JS(参照)</h2><div id="map"></div></div>
  <div><h2>ml2drender (WASM / GL JS raster) <span id="status"></span></h2><div id="out"></div></div>
</div>
<pre id="log"></pre>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
